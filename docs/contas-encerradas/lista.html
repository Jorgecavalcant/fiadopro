<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Contas encerradas</title>
  <link rel="stylesheet" href="painel.css" />
  <style>html, body { width: 1440px; }</style>
</head>
<body>
  <h2>Contas encerradas</h2>

          <th>Nome</th>
          <th>Encerrada</th>
          <th>Prazo</th>
          <th>Situação</th>

      <tbody>
        <tr>
          <td style="font-weight:800">M*** S***</td>
          <td>28/10/2026 09:00</td>

          <td><button class="fp-btn fp-btn-primary" type="button">Reativar</button></td>
        </tr>
        <tr>
          <td style="font-weight:800">A***</td>
          <td>20/10/2026 14:10</td>
          <td>4 dias</td>
          <td><span class="fp-badge fp-badge-danger">Ordem judicial</span></td>

      </tbody>
    </table>

</html>
