<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Reativar conta</title>
  <link rel="stylesheet" href="painel.css" />
  <style>html, body { width: 1440px; }</style>
</head>
<body>
  <div class="fp-overlay">
    <div class="fp-modal" role="dialog" aria-labelledby="reactivate-title">
      <h3 id="reactivate-title" style="margin:0 0 8px; font-size:18px">Reativar conta</h3>
      <p style="margin:0 0 16px; color:#65759D; font-size:14px">
        M*** S*** volta para a mesma conta. A observação fica no registro, sem e-mail, telefone, CPF ou Pix.
      </p>
      <form>
        <label for="reactivate-note" style="display:block; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#65759D; margin-bottom:6px">Observação</label>
        <textarea id="reactivate-note" class="fp-input" placeholder="Por que esta conta volta">Pedido conferido no balcao</textarea>
        <p style="color:#b45309; font-size:12px">Não cole CPF, senha ou chave Pix nesta observação.</p>
        <div class="actions">
          <button class="fp-btn fp-btn-ghost" type="button">Cancelar</button>
          <button class="fp-btn fp-btn-primary" type="button">Reativar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
