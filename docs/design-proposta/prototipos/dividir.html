<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dividir conta — protótipo</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <aside class="side-desk">
      <p class="brand">Fiado Pro</p>
      <a href="painel.html">Início</a>
      <a href="clientes.html">Pessoas</a>
      <a href="extrato.html">Extrato</a>
      <a class="on" href="dividir.html">Dividir</a>
      <a href="menu.html">Menu</a>
    </aside>
    <div class="main">
      <header class="hero">
        <a href="painel.html">Voltar</a>
        <h1>Dividir conta</h1>
        <p>Almoço TESTE · 29/10/2026</p>
      </header>
      <div class="sheet stack">
        <div class="field">
          <label for="total">Total da conta</label>
          <input id="total" class="money-input" type="text" value="R$ 180,00" readonly />
        </div>
        <div class="list">
          <div class="item">
            <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 3.5-4 7-4s5.5 1 7 4"/></svg></span>
            <span class="grow"><strong>TESTE Ana</strong><span>Parte igual</span></span>
            <span class="amt">R$ 60,00</span>
          </div>
          <div class="item">
            <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 3.5-4 7-4s5.5 1 7 4"/></svg></span>
            <span class="grow"><strong>TESTE Bruno</strong><span>Parte igual</span></span>
            <span class="amt">R$ 60,00</span>
          </div>
          <div class="item">
            <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 3.5-4 7-4s5.5 1 7 4"/></svg></span>
            <span class="grow"><strong>TESTE Carla</strong><span>Parte igual</span></span>
            <span class="amt">R$ 60,00</span>
          </div>
        </div>
        <button class="btn btn-quiet" type="button">Dividir igualmente</button>
        <button class="btn btn-primary" type="button">Confirmar divisão</button>
      </div>
    </div>
  </div>
</body>
</html>
