name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Scan de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Testes (se existirem)
        run: |
          if npm run | grep -qE '^  test$'; then pnpm test; else echo "sem testes de backend ainda"; fi
      - name: Backend — npm ci (igual ao Docker)
        run: |
          rm -rf node_modules
          npm ci
          npm run build
      - name: sharp carrega no Alpine, igual ao Docker de produção
        run: |
          rm -rf /tmp/fiado-alpine
          mkdir -p /tmp/fiado-alpine
          cp package.json package-lock.json /tmp/fiado-alpine/
          docker run --rm -v /tmp/fiado-alpine:/app -w /app node:20-alpine \
            sh -c "npm ci && node --input-type=module -e \"import sharp from 'sharp'; const b = await sharp({ create: { width: 2, height: 2, channels: 3, background: 'white' } }).png().toBuffer(); if (b.length < 8) process.exit(1);\""

  frontend:
    name: Frontend — testes + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - name: Garantir que nenhuma chave de API vazou para o bundle
        working-directory: .
        run: |
          if grep -rEo 'AIza[A-Za-z0-9_-]{30,}|sk-or-v1-[a-f0-9]{16,}' dist/assets/ ; then
            echo "::error::Chave de API detectada no bundle do frontend!"
            exit 1
          fi
          echo "Bundle limpo."
