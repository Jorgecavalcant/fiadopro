name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Scan de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - name: Testes (se existirem)
        run: |
          if npm run | grep -qE '^  test$'; then pnpm test; else echo "sem testes de backend ainda"; fi

  frontend:
    name: Frontend — testes + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
      - name: Garantir que nenhuma chave de API vazou para o bundle
        working-directory: .
        run: |
          if grep -rEo 'AIza[A-Za-z0-9_-]{30,}|sk-or-v1-[a-f0-9]{16,}' dist/assets/ ; then
            echo "::error::Chave de API detectada no bundle do frontend!"
            exit 1
          fi
          echo "Bundle limpo."
