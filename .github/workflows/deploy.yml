name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Deploy para produção
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias (workspace completo)
        run: pnpm install --frozen-lockfile

      - name: Backend — typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Frontend — testes + build
        working-directory: frontend
        run: |
          pnpm run test
          pnpm run build

      - name: Verificar bundle sem chaves de API
        run: |
          if grep -rEo 'AIza[A-Za-z0-9_-]{30,}|sk-or-v1-[a-f0-9]{16,}' dist/assets/ ; then
            echo "::error::Chave de API detectada no bundle — deploy abortado."
            exit 1
          fi

      - name: Montar payload de deploy
        run: |
          tar czf /tmp/fiadopro-payload.tar.gz \
            backend/src backend/migrations backend/package.json backend/package-lock.json \
            backend/tsconfig.json backend/Dockerfile \
            docker-compose.yml nginx.conf db-init.sql \
            scripts/deploy \
            dist

      - name: Configurar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 46.224.55.18 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar payload e executar deploy remoto
        run: |
          scp -i ~/.ssh/id_deploy /tmp/fiadopro-payload.tar.gz jorge@46.224.55.18:/tmp/fiadopro-payload.tar.gz
          ssh -i ~/.ssh/id_deploy jorge@46.224.55.18 \
            'mkdir -p /tmp/fiadopro-release && rm -rf /tmp/fiadopro-release/* && \
             tar xzf /tmp/fiadopro-payload.tar.gz -C /tmp/fiadopro-release && \
             bash /tmp/fiadopro-release/scripts/deploy/deploy-remote.sh /tmp/fiadopro-release'

      - name: Healthcheck externo pós-deploy
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.fiadopro.com.br/api/health)
          site=$(curl -s -o /dev/null -w '%{http_code}' https://www.fiadopro.com.br/)
          echo "API: $code | Site: $site"
          if [ "$code" != "200" ] || [ "$site" != "200" ]; then
            echo "::error::Healthcheck externo falhou (API=$code, site=$site)"
            exit 1
          fi
