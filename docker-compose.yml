# =================================================================
# Fiado Pro — docker-compose para VPS Hetzner
# Stack: Frontend (React) + Backend (Node.js) + Database (PostgreSQL)
# =================================================================

version: '3.9'

services:

  # ---------------------------------------------------------------
  # DATABASE — PostgreSQL para FIADO PRO
  # ---------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: fiado-pro-db
    restart: always
    environment:
      POSTGRES_DB: fiado_pro
      POSTGRES_USER: fiado_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - fiado-pro-db-data:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fiado-pro-rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiado_user -d fiado_pro"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"

  # ---------------------------------------------------------------
  # BACKEND — Node.js Express API
  # Porta externa: 10004 | Caddy roteia /api/*
  # ---------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fiado-pro-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: fiado-pro-db
      DB_PORT: 5432
      DB_NAME: fiado_pro
      DB_USER: fiado_user
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_PROJECT_ID: 66011111598
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CORS_ORIGIN: https://www.fiadopro.com.br,http://localhost:3000
      APP_URL: https://www.fiadopro.com.br
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api.asaas.com/v3}
      ASAAS_PRO_PRICE: ${ASAAS_PRO_PRICE:-19.90}
    ports:
      - "10004:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fiado-pro-rede
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------
  # WEB — Nginx servindo SPA estática + proxy para API
  # Porta externa: 10003 | Caddy roteia fiadopro.jcplanejamento.com.br
  # ---------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: fiado-pro-web
    restart: always
    ports:
      - "10003:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - fiado-pro-rede
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fiado-pro-rede:
    driver: bridge

volumes:
  fiado-pro-db-data:
    driver: local
