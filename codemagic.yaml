workflows:
  android-release:
    name: Android Release (Google Play)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      node: 20
      groups:
        - google_play   # definir no Codemagic UI (ver docs/ANDROID-BUILD.md)
      vars:
        PACKAGE_NAME: br.com.fiadopro.app
    scripts:
      - name: Install dependencies
        script: cd frontend && npm ci
      - name: Build web assets
        script: cd frontend && npm run build
      - name: Capacitor Android sync
        script: |
          cd frontend
          npx cap sync android
      - name: Configurar assinatura (a partir das env vars do Codemagic)
        script: |
          # CM_KEYSTORE = .jks em base64; demais = senhas/alias (encrypted no Codemagic UI)
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/frontend/android/app/fiado-pro-release.jks"
          cat > "$CM_BUILD_DIR/frontend/android/keystore.properties" <<EOF
          storeFile=fiado-pro-release.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build AAB assinado
        script: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - frontend/android/app/build/outputs/bundle/**/*.aab
      - frontend/android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal   # primeira subida: faixa de teste interno; promover na Play Console
        submit_as_draft: true

  ios-release:
    name: iOS Release
    environment:
      xcode: latest
      node: 18
      vars:
        BUNDLE_ID: br.com.fiadopro.app
    scripts:
      - name: Install dependencies
        script: cd frontend && npm ci
      - name: Build web assets
        script: cd frontend && npm run build
      - name: Capacitor iOS sync
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios
      - name: CocoaPods install
        script: cd frontend/ios/App && pod install
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        api_issuer: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
