# =================================================================
# Fiado Pro — STAGING (fiadopro.jcplanejamento.com.br)
# Isolado da produção: containers, rede, volume e portas próprios.
# Portas expostas apenas em 127.0.0.1 (acesso via Caddy).
# =================================================================

name: fiado-pro-staging

services:

  db:
    image: postgres:16-alpine
    container_name: fiado-pro-staging-db
    restart: always
    environment:
      POSTGRES_DB: fiado_pro
      POSTGRES_USER: fiado_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - fiado-pro-staging-db-data:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fiado-pro-staging-rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiado_user -d fiado_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fiado-pro-staging-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: fiado-pro-staging-db
      DB_PORT: 5432
      DB_NAME: fiado_pro
      DB_USER: fiado_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CORS_ORIGIN: https://fiadopro.jcplanejamento.com.br
      APP_URL: https://fiadopro.jcplanejamento.com.br
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_PRO_PRICE: ${ASAAS_PRO_PRICE:-19.90}
    ports:
      - "127.0.0.1:10014:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fiado-pro-staging-rede
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: nginx:alpine
    container_name: fiado-pro-staging-web
    restart: always
    ports:
      - "127.0.0.1:10013:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - fiado-pro-staging-rede

networks:
  fiado-pro-staging-rede:
    driver: bridge

volumes:
  fiado-pro-staging-db-data:
    driver: local
